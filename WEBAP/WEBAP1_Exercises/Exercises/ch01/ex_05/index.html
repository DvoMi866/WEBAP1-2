<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.5</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
            // TODO: #summary: display all values in the list #output
            $("#name").on("input", function()
            {
                if($(this).val().trim() === "")
                    $("#summary").prop("disabled", true);
                else
                    $("#summary").prop("disabled", false);
            });
            $("#summary").click(function()
            {
                $("#output").empty();
                $("#output").append("<li>Name: " + $("#name").val() + "</li>");
                $("#output").append("<li>E-mail: " + $("#email").val() + "</li>");
                $("#output").append("<li>Class: " + $("#class").val() + "</li>");
                $("#output").append("<li>Language: " + $('input[name="language"]:checked').val() + "</li>");
                $("#output").append("<li>Newsletter: " + ($("#newsletter").is(":checked") ? "Yes" : "No") + "</li>");
                $("#output").append("<li>Remarks: " + $("#remarks").val() + "</li>");
            });
            // TODO: enable/disable #summary depending on the name field (event input)

            // TODO: #reset: clear all fields and the list
            $("#reset").click(function()
            {
                $("#name").val("");
                $("#email").val("");
                $("#class").val("");
                $('input[value="EN"]').prop("checked", true);
                $("#newsletter").prop("checked", false);
                $("#remarks").val("");
                $("#output").empty();
                $("#summary").prop("disabled", true);
            });
        });
    </script>
</head>
<body>
    <h2>Exercise 1.5 – Registration</h2>
    <form id="registration">
        <p><label>Name: <input type="text" id="name"></label></p>
        <p><label>E-mail: <input type="email" id="email"></label></p>
        <p>
            <label>Class:
                <select id="class">
                    <option value="">– please select –</option>
                    <option value="1TPIF">1TPIF</option>
                    <option value="2TPIF">2TPIF</option>
                    <option value="3TPIF">3TPIF</option>
                </select>
            </label>
        </p>
        <p>
            Preferred language:
            <label><input type="radio" name="language" value="EN" checked> English</label>
            <label><input type="radio" name="language" value="FR"> French</label>
            <label><input type="radio" name="language" value="DE"> German</label>
        </p>
        <p><label><input type="checkbox" id="newsletter" value="yes"> I want to receive the newsletter</label></p>
        <p><label>Remarks:<br><textarea id="remarks" rows="3" cols="40"></textarea></label></p>
        <p>
            <button type="button" id="summary" disabled>Show summary</button>
            <button type="button" id="reset">Reset</button>
        </p>
    </form>
    <ul id="output"></ul>
</body>
</html>
