<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.3</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#greet").click(function () {
                if ($("#firstName").val() == "" || $("#lastName").val() == "") {
                    $("#message").text("Please fill both fields");
                }
                else {
                    $("#output").text($("#firstName").val().trim() + " " + $("#lastName").val().trim());
                    $("#firstName").val("");
                    $("#lastName").val("");
                    $("#message").text("");
                }
 
            })
            $("#lastName").keyup(function (e) {
                if (e.key === "Enter")               // which key was pressed?
                {
                    if ($("#firstName").val() == "" || $("#lastName").val() == "") {
                        $("#message").text("Please fill both fields");
                    }
                    else {
                        $("#output").text($("#firstName").val().trim() + " " + $("#lastName").val().trim());
                        $("#firstName").val("");
                        $("#lastName").val("");
                        $("#message").text("");
                    }  // trigger click of #go
                }
            });
 
            // TODO: #greet: read #firstName and #lastName with val() and display a greeting in #output
 
            // TODO: error message in #message (class error) if a field is empty
 
            // TODO: Enter in #lastName triggers the greeting
        });
    </script>
</head>
 
<body>
    <h2>Exercise 1.3 – Greeting</h2>
    <p>
        <input type="text" id="firstName" placeholder="First name">
        <input type="text" id="lastName" placeholder="Last name">
        <button id="greet">Greet me</button>
    </p>
    <p id="message"></p>
    <div id="output" class="box"></div>
</body>
 
</html>
