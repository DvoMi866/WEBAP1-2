<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.6</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
            // TODO: #add (and Enter in #task): append a new <li> to #list
                $('#add').click(function() {
                    var taskText = $('#task').val().trim();
                    if (taskText) {
                        $('#list').append('<li>' + taskText + '</li>');
                        $('#task').val(''); // Clear the input field
                        updateCount();
                    }
                });
                $('#task').keyup(function(e) {
                    if (e.key === "Enter") { // Enter key pressed
                        $('#add').click(); // Trigger the add button click
                        e.preventDefault(); // Prevent form submission
                    }
                });
            // TODO: click on an <li>: toggle the class done (event delegation!)
            $('#list').on('click', 'li', function() {
                $(this).toggleClass('done');
                updateCount();
            });
            // TODO: #clearDone: remove all completed tasks
            $('#clearDone').click(function() {
                $('#list .done').remove();
                updateCount();
            });
            // TODO: update #count
            function updateCount() {
                var openTasks = $('#list li:not(.done)').length;
                $('#count').text(openTasks);
            }
        });
    </script>
</head>
<body>
    <h2>Exercise 1.6 – To-do list</h2>
    <p>
        <input type="text" id="task" placeholder="New task">
        <button id="add">Add</button>
        <button id="clearDone">Remove completed tasks</button>
    </p>
    <p>Open tasks: <span id="count">0</span></p>
    <ul id="list"></ul>
</body>
</html>
